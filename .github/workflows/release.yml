name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to validate (dry run only; no tag or release is created)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Check source and contracts
        run: |
          .venv/bin/python scripts/audit_public_tree.py
          .venv/bin/python scripts/generate_contracts.py --check
          .venv/bin/python scripts/check_docs.py
          .venv/bin/python scripts/check_semantic_docs.py
          ./bin/grea legacy check_grea_skill --workspace-root . --json
      - name: Prepare locked optional test providers
        env:
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          npm ci --prefix tools/cocos --ignore-scripts --no-audit --no-fund
          dotnet restore tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --locked-mode
          dotnet build tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --no-restore --configuration Release
      - name: Test source
        env:
          GREA_ASSEMBLY_AUDIT_INTEGRATION: '1'
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build version-matched source bundle
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == push ]]; then args+=(--require-tag); fi
          .venv/bin/python scripts/release.py prepare --tag "$RELEASE_TAG" --out dist/release "${args[@]}"
          .venv/bin/python scripts/release.py verify --tag "$RELEASE_TAG" --out dist/release --extract "$RUNNER_TEMP/grea-extracted" --extract-skill "$RUNNER_TEMP/grea-skill"
      - name: Install and test extracted bundle
        run: |
          bundle="$RUNNER_TEMP/grea-extracted/grea-$RELEASE_TAG"
          test -f "$bundle/pyproject.toml"
          cd "$bundle"
          uv sync --frozen
          npm ci --prefix tools/cocos --ignore-scripts --no-audit --no-fund
          DOTNET_GENERATE_ASPNET_CERTIFICATE=false dotnet restore tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --locked-mode
          dotnet build tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --no-restore --configuration Release
          ./bin/grea session
          GREA_ASSEMBLY_AUDIT_INTEGRATION=1 .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/generate_contracts.py --check
          .venv/bin/python scripts/check_docs.py
          .venv/bin/python scripts/check_semantic_docs.py
          ./bin/grea legacy check_grea_skill --workspace-root . --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Download staged CI assets for readback
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/roundtrip
      - name: Verify transferred assets
        run: .venv/bin/python scripts/release.py verify --tag "$RELEASE_TAG" --out dist/roundtrip
  plugin-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-2022
            target: windows-x64
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Build and accept the native plugin
        shell: bash
        run: |
          uv run --frozen python scripts/build_plugin.py --target "${{ matrix.target }}" --tag "$RELEASE_TAG" --out dist/plugin
          uv run --frozen python scripts/verify_plugin.py --bundle dist/plugin/grea-plugin-${{ matrix.target }}.zip --report dist/plugin/plugin-acceptance.json
          uv run --frozen python scripts/build_plugin.py --target "${{ matrix.target }}" --tag "$RELEASE_TAG" --out dist/plugin-repeat
          cmp dist/plugin/grea-plugin-${{ matrix.target }}.zip dist/plugin-repeat/grea-plugin-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-plugin-${{ github.sha }}-${{ matrix.target }}
          path: dist/plugin/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [build, plugin-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-plugin-${{ github.sha }}-*
          path: dist/plugins
      - name: Bind plugin and acceptance to the release source
        run: |
          python3 scripts/release.py attach-plugin --tag "$RELEASE_TAG" --out dist/release --target macos-arm64 --plugin-dir "dist/plugins/release-plugin-${{ github.sha }}-macos-arm64"
          python3 scripts/release.py attach-plugin --tag "$RELEASE_TAG" --out dist/release --target windows-x64 --plugin-dir "dist/plugins/release-plugin-${{ github.sha }}-windows-x64"
          python3 scripts/release.py verify --tag "$RELEASE_TAG" --out dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-complete-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-complete-${{ github.sha }}
          path: dist/release
      - name: Publish verified assets through a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --out dist/release --repo "$REPOSITORY"
