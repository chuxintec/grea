name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: python3 scripts/audit_public_tree.py
      - run: .venv/bin/python scripts/generate_contracts.py --check
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./bin/grea legacy check_grea_skill --workspace-root . --json
