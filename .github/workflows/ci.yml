name: Source checks
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-15
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: Install locked optional AST test provider
        run: npm ci --prefix tools/cocos --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/audit_public_tree.py
      - run: .venv/bin/python scripts/generate_contracts.py --check
      - run: .venv/bin/python scripts/render_brand_assets.py --check
      - run: .venv/bin/python scripts/check_docs.py
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./bin/grea legacy check_grea_skill --workspace-root . --json

  python-minimum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.10'
      - run: uv sync --frozen
      - run: ./bin/grea session
      # Release maintenance requires Python 3.11; runtime minimum is checked separately.
      - run: .venv/bin/python -m unittest discover -s tests -p test_grea.py -v
      - run: .venv/bin/python -m unittest discover -s tests -p test_mcp.py -v
  plugin-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Build and accept relocatable native plugin
        run: |
          test "$(uname -m)" = arm64
          .venv/bin/python scripts/build_plugin.py --out dist/plugin
          .venv/bin/python scripts/verify_plugin.py --bundle dist/plugin/grea-plugin-macos-arm64.zip --report dist/plugin/plugin-acceptance.json
          .venv/bin/python scripts/build_plugin.py --out dist/plugin-repeat
          cmp dist/plugin/grea-plugin-macos-arm64.zip dist/plugin-repeat/grea-plugin-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugin-macos-${{ github.sha }}
          path: dist/plugin/*
          if-no-files-found: error
          retention-days: 7
  windows-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - shell: cmd
        run: bin\grea.cmd session

  assembly-metadata:
    runs-on: ubuntu-24.04
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GREA_ASSEMBLY_AUDIT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Build locked optional metadata reader
        run: |
          dotnet restore tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --locked-mode
          dotnet build tools/unity/assembly-audit/Grea.AssemblyAudit.csproj --no-restore --configuration Release
      - run: .venv/bin/python -m unittest discover -s tests -p test_unity_player_audit.py -v
