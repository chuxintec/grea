name: Source checks
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-14
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: python3 scripts/audit_public_tree.py
      - run: .venv/bin/python scripts/generate_contracts.py --check
      - run: .venv/bin/python scripts/check_docs.py
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./bin/grea legacy check_grea_skill --workspace-root . --json

  python-minimum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.10'
      - run: uv sync --frozen
      - run: ./bin/grea session
      # Release maintenance requires Python 3.11; runtime minimum is checked separately.
      - run: .venv/bin/python -m unittest discover -s tests -p test_grea.py -v
      - run: .venv/bin/python -m unittest discover -s tests -p test_mcp.py -v
  windows-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - shell: cmd
        run: bin\grea.cmd session
