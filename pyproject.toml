[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "grea"
version = "1.1.0.dev2"
description = "GREA: game research, source recovery and native project development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0", "pillow==12.2.0", "pypinyin==0.55.0"]

[project.optional-dependencies]
# Retain the previous installer option for pinned environments.
modules = []
astc = ["texture2ddecoder==1.0.6"]
unity-visuals = ["UnityPy==1.25.3", "texture2ddecoder==1.0.6"]

[project.scripts]
grea = "grea.cli:main"

[project.urls]
Repository = "https://github.com/chuxintec/grea"
Issues = "https://github.com/chuxintec/grea/issues"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["src"]
only-include = ["src/grea", "bin", "plugin", "schemas", "tools", "tests/unity/reference-project"]
exclude = ["**/__pycache__", "**/.DS_Store", "**/*.pyc", "**/node_modules", "**/vendor", "**/Library", "**/Temp", "**/obj", "**/*.dll", "**/*.exe", "**/*.dylib"]

[tool.hatch.build.targets.wheel.sources]
"src/grea" = "grea"
"bin" = "grea/_data/bin"
"plugin" = "grea/_data/plugin"
"schemas" = "grea/_data/schemas"
"tools" = "grea/_data/tools"
"tests/unity/reference-project" = "grea/_data/tests/unity/reference-project"

[tool.hatch.build.targets.wheel.force-include]
"registry.json" = "grea/_data/registry.json"
"providers.lock.json" = "grea/_data/providers.lock.json"
"modules.lock.json" = "grea/_data/modules.lock.json"
"launch.py" = "grea/_data/launch.py"
"launch_tool.py" = "grea/_data/launch_tool.py"
"launch_module.py" = "grea/_data/launch_module.py"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "zstandard==0.25.0",
]
