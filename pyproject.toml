[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "grea"
version = "2026.10.19"
description = "Game Reverse Engineering and Assembly: evidence-first Unity recovery CLI and MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0", "pillow==12.2.0"]

[project.scripts]
grea = "grea.cli:main"

[project.urls]
Repository = "https://github.com/chuxintec/grea"
Issues = "https://github.com/chuxintec/grea/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grea"]

[dependency-groups]
dev = [
    "zstandard==0.25.0",
]
